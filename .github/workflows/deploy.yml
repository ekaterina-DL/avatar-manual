# .github/workflows/deploy.yml
name: Deploy avatar manual site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r site/requirements.txt

      # Публичный профиль: наружу идёт только 2 этап. 3 этап ещё в работе — см.
      # docs/superpowers/specs/2026-09-03-public-build-stage2-only-design.md
      - name: Build site
        run: python -m mkdocs build -f site/mkdocs-public.yml --strict

      - name: Add robots.txt (no-index)
        run: |
          printf 'User-agent: *\nDisallow: /\n' > ../avatar-manual-build/build-public/robots.txt

      # Node 24: проверкам нужна встроенная база node:sqlite.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Проверки кода входа на сайт (site/cloudflare) — до выкладки.
      - name: Test site login
        run: node --test site/cloudflare/tests/auth.test.mjs

      # Та же сборка выкладывается на Cloudflare Pages (проект avatar-manual). Перед сайтом —
      # вход по логину и паролю: site/cloudflare/functions/_middleware.js (wrangler берёт папку
      # functions из текущей папки, поэтому запуск из site/cloudflare). База логинов D1 и
      # SESSION_SECRET привязаны к проекту в Cloudflare. Ключи выкладки — в секретах репозитория.
      - name: Deploy to Cloudflare Pages
        working-directory: site/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3.112.0 pages deploy ../../../avatar-manual-build/build-public \
            --project-name=avatar-manual --branch=main --commit-dirty=true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ../avatar-manual-build/build-public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
