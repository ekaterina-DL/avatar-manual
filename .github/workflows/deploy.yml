# .github/workflows/deploy.yml
name: Deploy avatar manual site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r site/requirements.txt

      # Публичный профиль: наружу идёт только 2 этап. 3 этап ещё в работе — см.
      # docs/superpowers/specs/2026-09-03-public-build-stage2-only-design.md
      - name: Build site
        run: python -m mkdocs build -f site/mkdocs-public.yml --strict

      - name: Add robots.txt (no-index)
        run: |
          printf 'User-agent: *\nDisallow: /\n' > ../avatar-manual-build/build-public/robots.txt

      # Та же сборка выкладывается на Cloudflare Pages (проект avatar-manual), где перед сайтом
      # будет вход по коду на почту (Cloudflare Access). Ключи — в секретах репозитория.
      # Первая команда создаёт проект, если его ещё нет (повторно — просто ошибка, её глушим).
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3.112.0 pages project create avatar-manual --production-branch=main || true
          npx --yes wrangler@3.112.0 pages deploy ../avatar-manual-build/build-public \
            --project-name=avatar-manual --branch=main --commit-dirty=true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ../avatar-manual-build/build-public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
