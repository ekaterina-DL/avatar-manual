# Соответствие «проверка программы (check_id) -> раздел мануала».
# Читает хук site/hooks/build_helper_rules.py при сборке сайта и кладёт тексты разделов
# (дословно) в <сайт>/assessor-helper/rules.json.
#
# Поля:
#   page      - страница мануала (путь от корня репозитория)
#   heading   - текст заголовка раздела без "#" и без "{: …}" (как видно на сайте)
#   title     - короткое название для окна программы
#   contains  - (необязательно) взять из раздела только абзацы/пункты с этой подстрокой
#               (строка или список; без учёта регистра) - для разделов, где про проверку
#               только часть текста (например, пункты «Другое»)
#   occurrence - (необязательно) какой по счёту одноимённый заголовок на странице, по умолчанию 1
#   heading может быть списком: тексты разделов идут подряд, примеры объединяются,
#               ссылка ведёт на первый раздел
#   examples_from - (необязательно) [{page?, heading, contains?}]: добавить примеры-видео из
#               другого раздела (contains - подстрока в подписи примера); текст оттуда не берётся
#
# Текст правила не обрезается: в окне программы правило свёрнуто, видно начало.
#
# Раздел переименован в мануале -> сборка сайта падает с именем check_id: поправьте здесь.
# Каждый check_id, который выдаёт программа, должен быть здесь (проверяет тест программы
# assessor-helper/tests/test_rules_map.py: запускает проверки на синтетических данных и ищет
# check_id в коде helper/analysis).

