site_name: Мануал асессора «Аватар»
site_dir: ../../avatar-manual-build/build
docs_dir: ..
site_url: https://ekaterina-dl.github.io/avatar-manual/

exclude_docs: |
  _raw-sources/
  README.md
  voprosy-zakazchiku.md
  manual-2-etap/_sources-log.md
  manual-3-etap/_sources-log.md
  site/PLAN.md
  site/requirements.txt
  site/mkdocs.yml
  site/mkdocs-pdf.yml
  site/theme/overrides/
  site/hooks/
  site/pdf/render_pdf.py
  site/prototype-reference/
  docs/
  .git/
  .github/

theme:
  name: material
  custom_dir: theme/overrides
  language: ru
  palette:
    primary: white
    accent: amber
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - site/theme/extra.css

extra_javascript:
  - site/theme/compare-tables.js

# Новая страница мануала должна быть добавлена сюда вручную — иначе будет собрана, но останется недоступной через меню/поиск
nav:
  - Главная: index.md
  - 2 этап:
      - Обзор проекта: manual-2-etap/00-overview.md
      - Общие требования: manual-2-etap/01-general-requirements.md
      - Сегменты: manual-2-etap/02-segments.md
      - Качество видео: manual-2-etap/03-video-quality.md
      - Классификатор: manual-2-etap/04-classifier.md
      - Что размечаем: manual-2-etap/05-what-to-label.md
      - Частые ошибки: manual-2-etap/06-common-mistakes.md
      - FAQ: manual-2-etap/07-faq.md
      - Лайфхаки: manual-2-etap/08-lifehacks.md
      - Спорные моменты: manual-2-etap/09-disputed-points.md
      - Журнал проверок ОС: manual-2-etap/10-qa-log.md
      - Банк примеров: manual-2-etap/11-example-library.md
  - 3 этап:
      - Обзор проекта: manual-3-etap/00-overview.md
      - Общие правила: manual-3-etap/06-general-requirements.md
      - Классификатор: manual-3-etap/01-classifier.md
      - Критерии качества: manual-3-etap/04-video-quality.md
      - Банк примеров: manual-3-etap/07-example-library.md
      - Открытые вопросы: manual-3-etap/02-open-questions.md
      - Частые ошибки: manual-3-etap/03-common-mistakes.md
      - Разбор кейсов (FAQ): manual-3-etap/05-faq.md

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      # Без unicode-slugify (по умолчанию python-markdown ASCII-only, unicode=False) заголовки
      # из чистой кириллицы без единой латинской буквы/цифры ("Темп речи", "Ракурс", "Эмоции",
      # "Диалоги и закадровый голос" и ещё ~100 по всему сайту) схлопываются в пустую строку и
      # получают нечитаемый порядковый id вида "_2", "_3" вместо ожидаемого "темп-речи" — из-за
      # этого ЛЮБая внутренняя ссылка на такой раздел (в т.ч. "→ ещё N прим." из
      # inject_example_previews.py и десятки существующих перекрёстных ссылок в самом мануале)
      # не долистывает до нужного места: браузер просто остаётся в начале страницы. Найдено
      # вживую в Task 10 QA (scrollY после перехода по ссылке = 0). pymdown-extensions уже
      # обязательная зависимость mkdocs-material — ничего нового не устанавливаем.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

hooks:
  - hooks/wrap_source_tags.py
  - hooks/inject_example_previews.py
  - hooks/hide_site_only_sections.py
  - hooks/fix_stage_relationship.py
  - hooks/embed_local_media.py
  - hooks/embed_video_links.py
  - hooks/group_media_lists.py
  - hooks/build_segment_examples.py
  - hooks/build_compare_cards.py
  - hooks/build_dispute_flow.py
  - hooks/friendly_md_link_text.py
  - hooks/neutralize_excluded_links.py
